services:
  db:
    image: postgres:16
    container_name: toktickit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toktickit
      POSTGRES_PASSWORD: toktickit
      POSTGRES_DB: toktickit
    ports:
      - "5432:5432"
    volumes:
      - toktickit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toktickit -d toktickit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  toktickit_pgdata:
